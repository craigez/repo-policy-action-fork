[tox]
envlist = cover, black, flake8, pylint, check-lockfiles
requires = tox-uv>=1
isolated_build = false
skipsdist = true

[testenv]
# tox-uv installs deps via `uv pip install`, which — unlike pip — does not
# fall back to the system certificate store by default. On networks with a
# TLS-inspecting proxy this fails with "invalid peer certificate:
# UnknownIssuer" unless uv is told to trust the system store.
set_env =
    UV_SYSTEM_CERTS = 1
deps = -rrequirements-dev.txt

[testenv:cover]
deps =
    {[testenv]deps}
    coverage
commands =
    coverage run -m pytest tests/
    coverage report -m
    coverage html

[testenv:black]
deps = black
skip_install = true
commands = black --check --diff src/ tests/

[testenv:autoformat]
deps = black
skip_install = true
commands = black src/ tests/

[testenv:isort]
deps = isort
skip_install = true
commands = isort --check-only src/ tests/

[testenv:flake8]
deps = flake8
skip_install = true
commands = flake8 --max-line-length=80 --max-complexity=10 --extend-ignore=E203 src/

[testenv:pylint]
deps =
    pylint
    -rrequirements.txt
commands = pylint src/

[testenv:check-lockfiles]
description = Fail if uv.lock or the generated requirements files are out of sync with pyproject.toml.
skip_install = true
allowlist_externals = uv, git
commands =
    uv lock --check
    uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
    uv export --frozen --no-hashes --no-emit-project -o requirements-dev.txt
    git diff --exit-code -- requirements.txt requirements-dev.txt
