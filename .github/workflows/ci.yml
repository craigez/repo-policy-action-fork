name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily — off-the-hour to avoid GitHub Actions load spikes.
    - cron: "17 3 * * *"

jobs:
  test:
    name: Run tests and lint checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run tox
        run: uvx --with tox-uv tox
